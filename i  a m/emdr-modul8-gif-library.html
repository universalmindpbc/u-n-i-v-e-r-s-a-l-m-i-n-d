      :root {

      html,

        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #08080a;
        color: #fff;

      body { padding: clamp(24px, 4vw, 64px); }

      header {
        display: grid;
        gap: 12px;
        width: min(920px, 100%);
        margin: 0 auto clamp(34px, 6vw, 72px);
      }

      header a,
      header p,
      header span {
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.08em;
        line-height: 1.6;
      }

        margin: 0;
        font-size: clamp(28px, 5vw, 58px);
        font-weight: 300;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }

      header p { max-width: 760px; margin: 0; }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
        gap: clamp(22px, 3vw, 46px);
        width: min(1600px, 100%);
        margin: 0 auto;
      }

      figure {
        content-visibility: auto;
        contain-intrinsic-size: 320px 352px;
        display: grid;
        gap: 10px;
        margin: 0;
      }

      figure img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #111114;
        object-fit: cover;
      }

      figcaption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      figure[data-current-m8="true"] figcaption::after {
        content: "current M8 lead set";
        color: rgba(255, 255, 255, 0.88);
        font-size: 9px;
        letter-spacing: 0.08em;
      }
    </style>
