<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="iam-citizen-needs-inference-endpoint" content="https://iam-citizen-needs-inference.universalmind.workers.dev/citizen-needs-inference">
    <title>VOGUE&nbsp;&nbsp;|&nbsp;&nbsp;I AM</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/vogue/iam/favicon.png?v=iam-favicon-3">
    <link rel="shortcut icon" type="image/png" href="/vogue/iam/favicon.png?v=iam-favicon-3">
    <link rel="apple-touch-icon" sizes="180x180" href="/vogue/iam/apple-touch-icon.png?v=iam-favicon-3">
    <link rel="preconnect" href="https://streamer.radio.co" crossorigin>
    <link rel="preconnect" href="https://streams.radio.co" crossorigin>
    <link rel="preconnect" href="https://s4.radio.co" crossorigin>
    <link rel="preload" as="image" href="a s s e t s/Vogue - Front Cover - Optimised.jpg?v=cover-2" fetchpriority="high">
    <link rel="stylesheet" href="globe.css?v=stream-reveal-6">
  </head>
  <body data-iam-auto-integrate="true">
    <main class="globe-page" aria-label="Vogue global check-in globe">
      <section class="globe-landing" aria-label="Global check-in landing page">
        <img class="globe-cover-layer" src="a s s e t s/Vogue - Front Cover - Optimised.jpg?v=cover-2" alt="" fetchpriority="high">
        <div class="landing-music-video" aria-hidden="true">
        <video
          data-music-video
          data-stream-file="a s s e t s/Homepage - Hero Background Video - Chanel 2020 Runway Show.mp4"
          data-stream-keep-alive
          data-stream-reveal="pending"
          autoplay
          muted
          preload="metadata"
          playsinline
          loop
        ></video>
      </div>

        <div id="globeViz" class="globe-viz" aria-hidden="true">
          <div class="globe-fallback">Global check-in loading</div>
        </div>

        <div class="globe-shade" aria-hidden="true"></div>

      <header class="globe-brand" aria-label="Universal Mind">
        <img class="globe-brand-mark" src="a s s e t s/Universal Mind [ I o H ] Logo.PNG" alt="">
        <div class="globe-brand-lockup brand-lockup" aria-live="polite">
          <span class="globe-brand-name brand-name" data-language>universalmind</span>
          <span class="globe-brand-suffix brand-suffix" data-brand-suffix>
            <span class="globe-brand-slash">/</span>
            <span class="globe-brand-iam">i am</span>
          </span>
        </div>
      </header>

      <section class="globe-welcome-copy" aria-label="Welcome home">
        <p>VOGUE&nbsp;&nbsp;//&nbsp;&nbsp;I AM</p>
        <strong>WELCOME HOME</strong>
      </section>

      <div class="globe-transfer-origin" data-iam-transfer-source aria-hidden="true"></div>

      <div class="iam-hero-reflection" data-iam-reflection aria-hidden="true">
        <canvas class="iam-reflection-flora" data-iam-reflection-flora aria-hidden="true"></canvas>
        <span data-iam-reflection-text></span>
      </div>

      <div class="iam-transfer-field" data-iam-transfer aria-hidden="true"></div>

      </section>
    </main>

    <script>
      if (window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost") {
        window.IAM_CITIZEN_NEEDS_INFERENCE_ENDPOINT = "/api/citizen-needs-inference";
      }
    </script>
    <script src="local-context.js?v=local-context-3"></script>
    <script src="adaptive-environment.js?v=adaptive-env-dcf221ac9c0e"></script>
    <script src="script.js?v=adaptive-env-stream-345a4d5421ec"></script>
    <script src="globe.js?v=globe-ba871211513f"></script>
  </body>
</html>
