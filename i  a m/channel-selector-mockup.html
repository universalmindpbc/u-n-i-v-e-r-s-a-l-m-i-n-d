<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Four Channels | I Am Mockup</title>
    <link rel="icon" href="a s s e t s/Universal Mind [ I o H ] Logo.PNG">
    <link rel="stylesheet" href="channel-selector-mockup.css?v=four-channels-1">
  </head>
  <body>
    <main class="channel-mockup" aria-label="Universal Mind four-channel selector mockup">
      <img
        class="channel-mockup__background"
        data-background-image
        alt=""
        aria-hidden="true"
      >
      <div class="channel-mockup__wash" aria-hidden="true"></div>

      <img
        class="channel-mockup__logo"
        src="a s s e t s/Universal Mind [ I o H ] Logo.PNG"
        alt="Universal Mind"
      >

      <div class="channel-mockup__live" aria-label="Live. 297 people watching">
        <strong>LIVE</strong>
        <span class="channel-mockup__eye" aria-hidden="true"></span>
        <span data-live-count>297</span>
      </div>

      <section class="channel-shelf" data-channel-shelf aria-labelledby="channel-shelf-title">
        <header class="channel-shelf__header">
          <div>
            <h1 id="channel-shelf-title"><span data-format-title>Videos</span> · shared channels</h1>
            <p>Join whatever is on now, together as one</p>
          </div>
          <button class="channel-shelf__close" type="button" data-shelf-close aria-label="Close shared channels">×</button>
        </header>

        <div class="channel-shelf__viewport">
          <div class="channel-shelf__grid" data-channel-grid role="list" aria-label="Four shared channels"></div>
        </div>

        <div class="channel-shelf__progress" aria-hidden="true">
          <span data-progress-label>1–4 / 4</span>
          <i></i>
        </div>
      </section>

      <section class="channel-control" aria-label="Music channel controls">
        <img src="a s s e t s/Universal Mind [ I o H ] Logo.PNG" alt="" aria-hidden="true">

        <div class="channel-control__formats" role="tablist" aria-label="Choose a shared music format">
          <button type="button" role="tab" data-format="videos" aria-selected="true">videos</button>
          <button type="button" role="tab" data-format="parties" aria-selected="false">dj sets + parties</button>
          <button type="button" role="tab" data-format="radio" aria-selected="false">radio</button>
        </div>

        <div class="channel-control__selector" role="group" aria-label="Choose a shared channel">
          <button class="channel-control__arrow" type="button" data-channel-previous aria-label="Previous shared channel">‹</button>
          <button class="channel-control__current" type="button" data-shelf-open aria-haspopup="dialog" aria-expanded="true">
            <span data-current-channel>Inner Planes</span>
            <small data-current-count>1 / 4</small>
          </button>
          <button class="channel-control__arrow" type="button" data-channel-next aria-label="Next shared channel">›</button>
        </div>
      </section>

      <p class="channel-mockup__time" aria-hidden="true">1:38</p>
      <p class="channel-mockup__note">Standalone selector concept · current staging experience unchanged</p>
    </main>

    <script src="cloudflare-stream-catalogue.js"></script>
    <script src="channel-selector-mockup.js?v=four-channels-1"></script>
  </body>
</html>
