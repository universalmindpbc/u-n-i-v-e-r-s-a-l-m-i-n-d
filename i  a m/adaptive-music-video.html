  <body class="adaptive-video-page" data-current-nav="demo">
    <main class="site-shell" aria-label="Universal Mind i am adaptive music video prototype">

              <span class="brand-slash">/</span>
              <span class="brand-iam">i a m</span>
            </span>

        </header>

        <button class="global-nav-trigger" type="button" aria-label="Open global navigation" data-nav-open></button>

        <section class="hero-casing adaptive-video-casing" aria-label="Adaptive hero music video" data-adaptive-video-casing>

          </div>
        </section>

        <form class="adaptive-video-checkin" data-adaptive-video-form>

          <input id="adaptive-video-checkin" name="checkin" type="text" autocomplete="off" maxlength="120" value="curious, tired, ready for beauty">
          <button type="submit">begin</button>
        </form>

        <div class="adaptive-video-status" aria-live="polite" data-video-status>

        <button class="adaptive-video-skip" type="button" data-video-skip hidden>
          radio

            <button type="button" data-json-toggle aria-expanded="true">hide</button>
