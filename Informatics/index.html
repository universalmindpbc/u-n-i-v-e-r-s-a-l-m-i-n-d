<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Universal Informatics</title>
<link rel="icon" href="/vogue/iam/favicon.png"><link rel="stylesheet" href="/Informatics/style.css?v=1">
<script defer src="/Informatics/app.js?v=1"></script>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<header><a href="/" class="brand">UNIVERSAL <span>INFORMATICS</span></a><span class="signature">M9 <i>／</i> P24</span></header>
<main>
<div class="diagram-shell">
<svg id="diagram" viewBox="0 0 800 800" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Fibonacci M9 P24</title><desc id="diagram-description">A 24-position Fibonacci circle, a continuous unicursal hexagram following 9,3,6,9,3,6, two intersecting equilateral triangles, a central hexagon, and a doubling path on a separate nine-position circle. This visual construction represents a proposed path, not a measured electron trajectory.</desc>
<g id="guides"></g><g id="alpha"></g><g id="hexagon"></g><g id="stars"></g><g id="unicursal"></g><g id="beta"></g><circle id="tracer" r="3" fill="white" opacity="0"/>
</svg>
<div class="sequence" id="sequence" aria-live="off">0 · 1 · 1 · 2 · 3 · 5 · 8</div>
</div>
</main>
<footer>
<div class="transport"><button id="play" aria-label="Pause animation" title="Pause animation">Ⅱ</button><button id="replay" aria-label="Replay animation" title="Replay animation">↺</button></div>
<nav aria-label="Construction stages"><button data-stage="0" aria-pressed="true"><small>01</small> Circle</button><button data-stage="1" aria-pressed="false"><small>02</small> Unicursal</button><button data-stage="2" aria-pressed="false"><small>03</small> Stars</button><button data-stage="3" aria-pressed="false"><small>04</small> Hexagon</button><button data-stage="4" aria-pressed="false"><small>05</small> Doubling</button></nav>
<span id="counter" aria-hidden="true">01 / 05</span>
<div class="timeline"><div id="progress"></div></div>
</footer>
<noscript><p>Enable JavaScript to view the geometric construction.</p></noscript>
</body></html>
