<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Universal Informatics</title>
<link rel="icon" href="/vogue/iam/favicon.png"><link rel="stylesheet" href="/Informatics/style.css?v=3">
<script defer src="/Informatics/landing.js?v=4"></script>
<script defer src="/Informatics/app.js?v=5"></script>

<body>
<section id="landing" aria-label="Universal Informatics">
<canvas class="rain-canvas" aria-hidden="true" data-rain-canvas></canvas><div class="rain-vignette" aria-hidden="true"></div>
<div class="access-shell"><img class="access-flower" src="/vogue/iam/a%20s%20s%20e%20t%20s/Universal%20Mind%20%5B%20I%20o%20H%20%5D%20Logo.PNG" alt=""><h1 class="access-title">universal informatics</h1><button id="launch" class="access-submit" disabled>Launch Full Screen</button><p id="launch-status" role="status"></p></div></section>
<section id="experience" hidden aria-label="M9 P24 geometric construction">
<video id="film" playsinline loop preload="none" data-src="https://rmu.universalmind.tv/rihanna-global-citizen-loop.mp4" aria-label="Rihanna at the Global Citizen Festival"></video><div class="film-shade" aria-hidden="true"></div>
<header><a href="/" class="brand">UNIVERSAL <span>INFORMATICS</span></a><div class="experience-actions"><span class="signature">M9 <i>／</i> P24</span><button id="sound" aria-label="Mute video" title="Mute video">♫</button><button id="fullscreen" aria-label="Enter full screen" title="Full screen">⛶</button><button id="back" aria-label="Return to landing" title="Return to landing">×</button></div></header>
<main>
<div class="diagram-shell">
<svg id="diagram" viewBox="0 0 800 800" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Fibonacci M9 P24</title><desc id="diagram-description">A 24-position Fibonacci circle, a continuous unicursal hexagram following 9,3,6,9,3,6, two intersecting equilateral triangles, a green hexagon touching the circle, and a doubling path on a separate nine-position circle. This visual construction represents a proposed path, not a measured electron trajectory.</desc>
<g id="guides"></g><g id="alpha"></g><g id="hexagon"></g><g id="stars"></g><g id="unicursal"></g><g id="beta"></g><circle id="tracer" r="3" fill="white" opacity="0"/>
</svg>
<div class="sequence" id="sequence" aria-live="off">0 · 1 · 1 · 2 · 3 · 5 · 8</div>
</div>
</main>
<footer>
<span class="research-target-label" id="research-target-label">OXTR research targets</span>
<nav aria-labelledby="research-target-label"><button data-stage="0" aria-pressed="true"><small>01</small> Circadian</button><button data-stage="1" aria-pressed="false"><small>02</small> Valence electron orbitals</button><button data-stage="2" aria-pressed="false"><small>03</small> Molecular docking</button><button data-stage="3" aria-pressed="false"><small>04</small> π stacking</button><button data-stage="4" aria-pressed="false"><small>05</small> Mitosis</button></nav>
<div class="transport"><button id="play" aria-label="Pause animation" title="Pause animation">Ⅱ</button><button id="replay" aria-label="Replay animation" title="Replay animation">↺</button></div>
<span id="counter" aria-hidden="true">01 / 05</span>
<div class="timeline"><div id="progress"></div></div>
</footer>
</section>
<noscript><p>Enable JavaScript to view the geometric construction.</p></noscript>
</body></html>
