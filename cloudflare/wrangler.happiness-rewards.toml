name = "iam-happiness-rewards"
main = "happiness-rewards-worker.js"
compatibility_date = "2026-07-28"
workers_dev = true
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
HAPPINESS_NETWORK = "polygon-amoy"
HAPPINESS_CHAIN_ID = "80002"
HAPPINESS_MUTATIONS_ENABLED = "false"
HAPPINESS_USDC_RESERVE_ENABLED = "false"
HAPPINESS_CHAINLINK_ENABLED = "false"
HAPPINESS_IMPACT_FUNDING_ENABLED = "false"
HAPPINESS_COLLECTIVE_EMISSIONS_ENABLED = "false"

# Activation remains fail-closed until these secrets and identifiers are deliberately configured:
# HAPPINESS_POLYGON_CONTRACT_ADDRESS
# HAPPINESS_SIGNER_KEY
# HAPPINESS_CHAINLINK_DON_ID
# HAPPINESS_CHAINLINK_SUBSCRIPTION_ID
# HAPPINESS_CHAINLINK_SOURCE_HASH
# HAPPINESS_ORACLE_CONSUMER_ADDRESS
# HAPPINESS_SPONSOR_ESCROW_ADDRESS
# HAPPINESS_COMMUNITY_TREASURY_ADDRESS
# HAPPINESS_COLLECTIVE_MIN_UNIQUE_CHECKINS
# HAPPINESS_COLLECTIVE_MIN_CONTINUITY_BPS
# HAPPINESS_COLLECTIVE_EPOCH_MINT_UNITS
# HAPPINESS_COLLECTIVE_WEEKLY_CAP_UNITS
# HAPPINESS_COLLECTIVE_TOTAL_CAP_UNITS
# HAPPINESS_USDC_TREASURY_ADDRESS
# CIRCLE_API_KEY
# HAPPINESS_APPLE_PASS_TYPE_IDENTIFIER
# HAPPINESS_APPLE_PASS_CERTIFICATE
