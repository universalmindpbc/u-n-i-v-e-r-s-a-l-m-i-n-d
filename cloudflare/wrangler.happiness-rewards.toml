name = "iam-happiness-rewards"
main = "happiness-rewards-worker.js"
compatibility_date = "2026-07-28"
workers_dev = true
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
HAPPINESS_NETWORK = "polygon-amoy"
HAPPINESS_CHAIN_ID = "80002"
HAPPINESS_MUTATIONS_ENABLED = "false"
HAPPINESS_USDC_RESERVE_ENABLED = "false"
HAPPINESS_CHAINLINK_ENABLED = "false"
HAPPINESS_CHAINLINK_CRE_ENABLED = "false"
HAPPINESS_IMPACT_FUNDING_ENABLED = "false"
HAPPINESS_COLLECTIVE_EMISSIONS_ENABLED = "false"
HAPPINESS_A2A_ENABLED = "false"
HAPPINESS_A2A_REWARDS_ENABLED = "false"
HAPPINESS_PILOT_ENABLED = "false"
HAPPINESS_SIMULATION_ENABLED = "false"
HAPPINESS_MEMBER_READS_ENABLED = "false"
HAPPINESS_APPLE_PASS_ISSUANCE_ENABLED = "false"
HAPPINESS_APPLE_PASS_UPDATES_ENABLED = "false"

# Activation remains fail-closed until these secrets and identifiers are deliberately configured:
# HAPPINESS_POLYGON_CONTRACT_ADDRESS
# HAPPINESS_ISSUER_ADDRESS
# HAPPINESS_SIGNER_KEY_REFERENCE (managed secret/KMS reference only; never the deployer private key)
# HAPPINESS_CHAINLINK_CRE_WORKFLOW_ID
# HAPPINESS_CHAINLINK_CRE_WORKFLOW_HASH
# HAPPINESS_CHAINLINK_CRE_CAPABILITY_CONFIG_HASH
# HAPPINESS_ORACLE_CONSUMER_ADDRESS
# HAPPINESS_SPONSOR_ESCROW_ADDRESS
# HAPPINESS_COMMUNITY_TREASURY_ADDRESS
# HAPPINESS_COLLECTIVE_MIN_UNIQUE_CHECKINS
# HAPPINESS_COLLECTIVE_MIN_CONTINUITY_BPS
# HAPPINESS_COLLECTIVE_EPOCH_MINT_UNITS
# HAPPINESS_COLLECTIVE_WEEKLY_CAP_UNITS
# HAPPINESS_COLLECTIVE_TOTAL_CAP_UNITS
# HAPPINESS_A2A_PUBLIC_BASE_URL
# HAPPINESS_A2A_ISSUER_ID
# HAPPINESS_A2A_APPROVER_QUORUM
# HAPPINESS_A2A_EVALUATION_POLICY_HASH
# HAPPINESS_INTERNAL_TOKEN
# HAPPINESS_IDENTITY_ISSUER
# HAPPINESS_BASELINE_AWARD_UNITS
# HAPPINESS_CITIZEN_BONUS_RULES_HASH
# HAPPINESS_COLLECTIVE_UNLOCK_RULES_HASH
# HAPPINESS_USDC_TREASURY_ADDRESS
# CIRCLE_API_KEY
# HAPPINESS_APPLE_PASS_TYPE_IDENTIFIER
# HAPPINESS_APPLE_PASS_CERTIFICATE
# HAPPINESS_APPLE_TEAM_IDENTIFIER
# HAPPINESS_APPLE_WEB_SERVICE_URL
# HAPPINESS_APPLE_AUTHENTICATION_TOKEN
