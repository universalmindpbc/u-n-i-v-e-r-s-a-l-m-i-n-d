name = "iam-citizen-needs-inference"
main = "iam-citizen-needs-worker.js"
compatibility_date = "2026-07-03"
workers_dev = true
preview_urls = true

[[rules]]
type = "Text"
globs = [ "**/*.txt" ]
fallthrough = true

[vars]
OPENAI_INFERENCE_MODEL = "gpt-5.5"
ZAMA_SENSITIVE_INSIGHT_BENCHMARK_ENABLED = "false"
ZAMA_REAL_CITIZEN_SHADOW_TRAFFIC_ENABLED = "false"
FHENIX_HAPPINESS_BENCHMARK_ENABLED = "false"
FHENIX_HAPPINESS_ISSUANCE_ENABLED = "false"
AWS_HEALTHOMICS_REGION = "ap-southeast-2"
AWS_HEALTHOMICS_READS_ENABLED = "false"
AWS_HEALTHOMICS_WRITES_ENABLED = "false"
UNIVERSAL_MIND_HORIZON_2_ENABLED = "false"
UNIVERSAL_MIND_HORIZON_3_ENABLED = "false"

# Future identifiers remain outside source until their empty, KMS-protected resources are approved:
# FHENIX_HAPPINESS_PILOT_CONTRACT_ADDRESS
# AWS_HEALTHOMICS_SEQUENCE_STORE_ID
# AWS_HEALTHOMICS_KMS_KEY_ARN
# PRIVACY_RESEARCH_INTERNAL_TOKEN

[secrets]
required = [ "OPENAI_API_KEY" ]

[[ratelimits]]
name = "REALTIME_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 12
  period = 60
