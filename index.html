<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Universal Mind</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/vogue/iam/favicon.png?v=iam-favicon-3">
    <link rel="shortcut icon" type="image/png" href="/vogue/iam/favicon.png?v=iam-favicon-3">
    <link rel="apple-touch-icon" sizes="180x180" href="/vogue/iam/apple-touch-icon.png?v=iam-favicon-3">
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        padding: 32px 24px;
        background: #000;
      }

      .rain-canvas,
      .rain-vignette {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .rain-canvas {
        z-index: -2;
        display: block;
        opacity: 0.96;
        transform: scale(1.01);
        transform-origin: center;
        transition: opacity 420ms ease, filter 420ms ease, transform 720ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .rain-vignette {
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, transparent 15%, transparent 82%, rgba(0, 0, 0, 0.32) 100%),
          radial-gradient(circle at center, transparent 38%, rgba(0, 0, 0, 0.08) 70%, rgba(0, 0, 0, 0.32) 130%);
      }

      .access-shell {
        width: min(100%, 440px);
        position: relative;
        padding: 76px 48px 70px;
        text-align: center;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.88) 0%,
          rgba(0, 0, 0, 0.74) 30%,
          rgba(0, 0, 0, 0.4) 54%,
          rgba(0, 0, 0, 0.08) 76%,
          transparent 100%
        );
        transition: opacity 360ms ease, transform 620ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .access-title {
        margin: 0 0 52px;
        font-family: "Bodoni 72", Didot, "Times New Roman", serif;
        font-size: clamp(15px, 2.3vw, 19px);
        font-weight: 400;
        letter-spacing: 0.36em;
        line-height: 1.7;
        text-transform: lowercase;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
      }

      .access-form {
        display: grid;
        gap: 18px;
      }

      .access-label {
        font-size: 11px;
        letter-spacing: 0.32em;
        text-transform: lowercase;
      }

      .access-input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 0;
        padding: 13px 2px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-align: center;
        outline: none;
        appearance: none;
      }

      .access-input:focus {
        border-bottom-color: #fff;
        box-shadow: 0 8px 18px -18px rgba(255, 255, 255, 0.9);
      }

      .access-submit {
        justify-self: center;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 0;
        margin-top: 10px;
        padding: 12px 30px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: lowercase;
        cursor: pointer;
      }

      .access-submit:hover,
      .access-submit:focus-visible {
        background: #fff;
        color: #000;
      }

      .access-error {
        min-height: 18px;
        margin: 2px 0 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 10px;
        letter-spacing: 0.2em;
        line-height: 1.8;
        text-transform: lowercase;
      }

      .access-form.is-rejected {
        animation: access-rejection 280ms ease-out;
      }

      body[data-access-focus="true"] .rain-canvas {
        opacity: 0.88;
        filter: contrast(1.06);
      }

      body[data-access-state="granted"] .rain-canvas {
        opacity: 0;
        filter: brightness(2.2) contrast(1.18);
        transform: scaleX(1.16) scaleY(1.04);
      }

      body[data-access-state="granted"] .access-shell {
        opacity: 0;
        transform: scale(0.97);
      }

      @keyframes access-rejection {
        0%, 100% { transform: translateX(0); }
        28% { transform: translateX(-3px); }
        62% { transform: translateX(3px); }
      }

      @media (max-width: 520px) {
        body {
          padding: 20px 14px;
        }

        .access-shell {
          padding: 64px 14px 58px;
        }

        .access-title {
          margin-bottom: 46px;
          font-size: 15px;
          letter-spacing: 0.28em;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .access-submit {
          transition: background-color 160ms ease, color 160ms ease;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rain-canvas,
        .access-shell {
          transition: none;
        }

        .access-form.is-rejected {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas class="rain-canvas" aria-hidden="true" data-rain-canvas></canvas>
    <div class="rain-vignette" aria-hidden="true"></div>
    <main class="access-shell">
      <h1 class="access-title">u n i v e r s a l&nbsp;&nbsp;m i n d</h1>
      <form class="access-form" data-access-form novalidate>
        <label class="access-label" for="access-password">password</label>
        <input
          class="access-input"
          id="access-password"
          name="password"
          type="password"
          autocomplete="current-password"
          autocapitalize="none"
          spellcheck="false"
          required
          data-access-password
        >
        <button class="access-submit" type="submit">enter</button>
        <p class="access-error" role="status" aria-live="polite" data-access-error></p>
      </form>
    </main>

    <script>
      (() => {
        const canvas = document.querySelector("[data-rain-canvas]");
        const context = canvas?.getContext("2d", { alpha: false });
        if (!canvas || !context) return;

        const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        const abstractGlyphs = [
          "0", "1", "2", "3", "7", "<", ">", "[", "]", "=", "+", "*", "·",
          "⋮", "⋯", "⌁", "⌇", "⌗", "△", "▽", "◇", "◊", "⟡", "┆", "┊",
          "╱", "╲", "╳", "⌞", "⌜", "⌟", "⌝"
        ];
        const signatureGlyphs = ["V", "V", "V", "V", "I", "A", "M"];
        const pearlTones = [
          [255, 245, 237],
          [255, 224, 236],
          [232, 226, 255]
        ];
        const state = {
          width: 0,
          height: 0,
          ratio: 1,
          cell: 22,
          columns: [],
          frame: 0,
          lastTime: 0,
          exitingAt: 0
        };

        const randomBetween = (minimum, maximum) => minimum + Math.random() * (maximum - minimum);
        const pick = (items) => items[Math.floor(Math.random() * items.length)];
        const nextGlyph = () => {
          const character = Math.random() < 0.18 ? pick(signatureGlyphs) : pick(abstractGlyphs);
          const anomaly = (character === "V" && Math.random() < 0.22) || Math.random() < 0.026;
          return {
            character,
            editorial: Math.random() < 0.17,
            anomaly,
            tone: anomaly ? pick(pearlTones) : [255, 255, 255]
          };
        };

        const createColumn = (index) => {
          const trailLength = Math.round(randomBetween(18, 36));
          return {
            x: index * state.cell + state.cell * randomBetween(0.32, 0.68),
            headY: randomBetween(state.cell, state.height + (trailLength - 2) * state.cell),
            speed: randomBetween(66, 152),
            opacity: randomBetween(0.7, 1),
            trailLength,
            advance: randomBetween(0, state.cell),
            glyphs: Array.from({ length: trailLength }, nextGlyph)
          };
        };

        const rebuild = () => {
          state.width = Math.max(1, window.innerWidth);
          state.height = Math.max(1, window.innerHeight);
          state.ratio = Math.min(window.devicePixelRatio || 1, 1.75);
          state.cell = state.width < 520 ? 18 : state.width < 980 ? 21 : 23;

          canvas.width = Math.round(state.width * state.ratio);
          canvas.height = Math.round(state.height * state.ratio);
          canvas.style.width = `${state.width}px`;
          canvas.style.height = `${state.height}px`;
          context.setTransform(state.ratio, 0, 0, state.ratio, 0, 0);

          const columnCount = Math.ceil(state.width / state.cell) + 1;
          state.columns = Array.from({ length: columnCount }, (_, index) => createColumn(index));
          canvas.dataset.rainColumns = String(columnCount);
          canvas.dataset.rainPalette = "monochrome";
          canvas.dataset.rainDensity = "full";
          canvas.dataset.rainAnomalies = "pearl-blush";
          canvas.dataset.rainStatus = motionQuery.matches ? "static" : "running";
        };

        const recycleColumn = (column) => {
          column.headY = randomBetween(-state.cell * 5, -state.cell);
          column.speed = randomBetween(66, 152);
          column.opacity = randomBetween(0.7, 1);
          column.trailLength = Math.round(randomBetween(18, 36));
          column.advance = 0;
          column.glyphs = Array.from({ length: column.trailLength }, nextGlyph);
        };

        const draw = (time) => {
          const elapsed = state.lastTime ? Math.min((time - state.lastTime) / 1000, 0.08) : 0;
          state.lastTime = time;
          const departure = state.exitingAt ? Math.min((time - state.exitingAt) / 700, 1) : 0;
          const speedMultiplier = 1 + departure * 5;

          context.fillStyle = "#000";
          context.fillRect(0, 0, state.width, state.height);
          context.textAlign = "center";
          context.textBaseline = "middle";

          state.columns.forEach((column) => {
            if (!motionQuery.matches) {
              column.headY += column.speed * elapsed * speedMultiplier;
              column.advance += column.speed * elapsed * speedMultiplier;
              while (column.advance >= state.cell) {
                column.advance -= state.cell;
                column.glyphs.unshift(nextGlyph());
                column.glyphs.pop();
              }
            }

            const direction = column.x < state.width / 2 ? -1 : 1;
            const departureOffset = direction * departure * departure * state.width * 0.11;

            for (let index = column.trailLength - 1; index >= 0; index -= 1) {
              const y = column.headY - index * state.cell;
              if (y < -state.cell || y > state.height + state.cell) continue;

              const glyph = column.glyphs[index];
              const distance = index / Math.max(column.trailLength - 1, 1);
              const alpha = Math.max(0.035, Math.pow(1 - distance, 1.42) * column.opacity);
              const isHead = index === 0;
              const isSignatureV = glyph.character === "V" && glyph.editorial;
              const [red, green, blue] = glyph.tone;

              context.font = isSignatureV
                ? `${Math.round(state.cell * 1.06)}px Didot, "Bodoni 72", "Times New Roman", serif`
                : `${Math.round(state.cell * 0.86)}px "SFMono-Regular", Menlo, Consolas, monospace`;
              context.fillStyle = `rgba(${red}, ${green}, ${blue}, ${isHead ? Math.min(1, alpha + 0.22) : alpha})`;
              context.shadowColor = isHead
                ? `rgba(${red}, ${green}, ${blue}, ${glyph.anomaly ? 0.98 : 0.92})`
                : "transparent";
              context.shadowBlur = isHead ? 11 : 0;
              context.fillText(glyph.character, column.x + departureOffset, y);
            }

            if (column.headY - column.trailLength * state.cell > state.height) {
              recycleColumn(column);
            }
          });

          context.shadowBlur = 0;
          state.frame = window.requestAnimationFrame(render);
        };

        const render = (time) => {
          if (document.hidden) return;
          if (time - state.lastTime < 1000 / 30 && state.lastTime) {
            state.frame = window.requestAnimationFrame(render);
            return;
          }
          draw(time);
        };

        const start = () => {
          window.cancelAnimationFrame(state.frame);
          state.lastTime = 0;
          if (motionQuery.matches) {
            draw(performance.now());
            window.cancelAnimationFrame(state.frame);
            state.frame = 0;
            return;
          }
          state.frame = window.requestAnimationFrame(render);
        };

        const handleMotionChange = () => {
          canvas.dataset.rainStatus = motionQuery.matches ? "static" : "running";
          start();
        };

        rebuild();
        start();
        window.addEventListener("resize", () => {
          rebuild();
          start();
        }, { passive: true });
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) start();
        });
        document.addEventListener("um:access-granted", () => {
          state.exitingAt = performance.now();
        });
        motionQuery.addEventListener?.("change", handleMotionChange);
      })();
    </script>

    <script>
      (() => {
        const allowedPasswordHashes = new Set([
          "95ad12a6f06a11c5ec4de138f63f0065aa61eb48157b750beaeeed2a4ec01d4f",
          "de60f72e9e3d9c93159ddcf26bec48a4e1c4516dd050c46a4e2c3e339a3dee22",
          "63ccf93639ee0f851cd1fde9dd880948f89af2993bc685c09cb5ff7bf1c5f1b8",
          "9150328d4eac1e52783a656fdfaec9295704c127e3d2b76c5194b941c072a66c",
          "a4abddbf6baad08c17395862cea8f55665e654c7237be4f2fdfa6a06138ca3dc",
          "1e6c6c9d57ee2d45bb19b5f332580541aac2bf725b6851a951438944c152f539"
        ]);
        const form = document.querySelector("[data-access-form]");
        const passwordInput = document.querySelector("[data-access-password]");
        const errorMessage = document.querySelector("[data-access-error]");

        passwordInput.addEventListener("focus", () => {
          document.body.dataset.accessFocus = "true";
        });

        passwordInput.addEventListener("blur", () => {
          delete document.body.dataset.accessFocus;
        });

        const rejectAccess = (message) => {
          errorMessage.textContent = message;
          form.classList.remove("is-rejected");
          void form.offsetWidth;
          form.classList.add("is-rejected");
        };

        const hashPassword = async (password) => {
          const bytes = new TextEncoder().encode(password);
          const digest = await window.crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
        };

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          errorMessage.textContent = "";

          const password = passwordInput.value.trim();
          if (!password) {
            rejectAccess("please enter your password");
            passwordInput.focus();
            return;
          }

          try {
            const passwordHash = await hashPassword(password);
            if (allowedPasswordHashes.has(passwordHash)) {
              document.body.dataset.accessState = "granted";
              document.dispatchEvent(new CustomEvent("um:access-granted"));
              window.setTimeout(() => {
                window.location.assign("/vogue/iam/induction.html");
              }, 700);
              return;
            }
          } catch (error) {
            rejectAccess("unable to verify — please try again");
            return;
          }

          rejectAccess("password not recognised");
          passwordInput.select();
        });
      })();
    </script>
  </body>
</html>
